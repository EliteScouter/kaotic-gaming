# Kaotic Gaming site. Quick start:
#   cp .env.example .env      (fill it in)
#   docker compose up -d --build
# With the optional Cloudflare Tunnel container:
#   docker compose --profile tunnel up -d --build
services:
  site:
    build: .
    image: kaoticgaming-site
    # always built from this repo, never pulled (Portainer's Git updates pull before deploying)
    pull_policy: build
    restart: unless-stopped
    init: true
    ports:
      - "${SITE_PORT:-8088}:8088"
    environment:
      # 1 = a reverse proxy / tunnel sits in front and passes the visitor's real IP and https status
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      # first admin, created on first start only if no admin exists yet
      KG_ADMIN_USER: "${KG_ADMIN_USER:-}"
      KG_ADMIN_PASSWORD: "${KG_ADMIN_PASSWORD:-}"
      # the games come from their own GitHub repos (games.json "source"); private repos need a token that can read them
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GAME_SYNC_MINUTES: "${GAME_SYNC_MINUTES:-5}"
      KG_GAMES_DIR: /games
      # 99¢ Supporter Pack through PayPal (see DEPLOY.md, "Taking payments"). Leave empty to keep the shop off.
      PAYPAL_ENV: "${PAYPAL_ENV:-sandbox}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      PAYPAL_TESTERS: "${PAYPAL_TESTERS:-}"
    volumes:
      - kg-data:/data
      - kg-games:/games

  # Last Light's multiplayer server: runs the game's own server.py from the copy the site downloaded,
  # and restarts it when the game updates. Only the site can reach it (no ports published); the site
  # lets in signed-in players only and passes their account name (X-KG-User) along.
  last-light:
    build: ./game-server
    image: kaoticgaming-game-server
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      GAME_SLUG: last-light
      GAME_COMMAND: python server.py
      PORT: "8000"
      KG_TRUST_USER_HEADER: "1"
    volumes:
      - kg-games:/games:ro

  # Optional: Cloudflare Tunnel, so no ports need to be opened on the server.
  # In the tunnel's published application routes, point the hostnames at http://site:8088
  tunnel:
    image: cloudflare/cloudflared:latest   # pin a specific version here if you prefer
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      - site
    profiles: ["tunnel"]

volumes:
  kg-data:
  kg-games:
